<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة - رمشة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .box {
            width: min(92%, 400px);
            background: white;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,.10);
            text-align: center;
        }

        h1 {
            color: #ff7a00;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #ff7a00;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #d32f2f;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔐 إدارة رمشة</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="كلمة مرور الإدارة"
            required
            autofocus
        >

        <button type="submit">
            دخول
        </button>

    </form>

</div>

</body>
</html>
