<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات التطبيق - رمشة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .header {
            background: #ff7a00;
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(0,0,0,.07);
        }

        .setting-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .setting-desc {
            color: #777;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #ff7a00;
        }

        .unit {
            margin-top: 7px;
            color: #888;
            font-size: 13px;
        }

        .save {
            width: 100%;
            margin-top: 20px;
            border: 0;
            background: #ff7a00;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 12px;
            background: #f1f1f1;
            color: #333;
            text-decoration: none;
            text-align: center;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
        }

        .error {
            background: #ffe5e5;
            color: #c00;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            background: #e8f8ee;
            color: #168a45;
            padding: 13px 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ccefdc;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>⚙️ إعدادات التطبيق</h1>
</div>

<div class="container">

    <div class="card">

        <div class="setting-title">🛵 أجور التوصيل</div>

        <div class="setting-desc">
            حدد المبلغ الذي سيتم احتسابه على العميل مقابل توصيل الطلب.
            سيتم استخدام هذا المبلغ تلقائيًا في السلة والطلبات الجديدة.
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success">✅ {{ success }}</div>
        {% endif %}

        <form method="POST">

            <label for="delivery_fee">
                أجور التوصيل
            </label>

            <input
                type="number"
                id="delivery_fee"
                name="delivery_fee"
                value="{{ delivery_fee }}"
                min="0"
                step="1"
                required
            >

            <div class="unit">
                المبلغ بالليرة السورية (ل.س)
            </div>

            <button type="submit" class="save">
                💾 حفظ أجور التوصيل
            </button>

        </form>

        <a href="/admin" class="back">
            ← العودة إلى لوحة الإدارة
        </a>

    </div>

</div>

<script>
    setTimeout(function () {
        const success = document.querySelector(".success");

        if (success) {
            success.style.transition = "opacity 0.4s ease, transform 0.4s ease";
            success.style.opacity = "0";
            success.style.transform = "translateY(-8px)";

            setTimeout(function () {
                success.remove();
            }, 450);
        }
    }, 3000);
</script>

</body>
</html>
